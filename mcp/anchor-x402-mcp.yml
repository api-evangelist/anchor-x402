  capabilities:
    tools: true
authentication:
  type: x402
  header: PAYMENT-SIGNATURE
  header_legacy: X-PAYMENT
  free_methods:
  - server/discover
  - initialize
  - tools/list
  paid_methods:
  - tools/call
  flow: A tools/call without payment returns a RESULT (not a JSON-RPC error) with isError true and the
    x402 challenge in structuredContent.accepts. The caller signs one of the offered rails and retries
    the identical tools/call with a PAYMENT-SIGNATURE header. The provider states the challenge is delivered
    as a result deliberately, because a JSON-RPC error would be swallowed by the client before the model
    saw it.
  payment_metadata:
    location: _meta["com.anchor-x402/payment"]
    since_protocol_version: '2025-06-18'
    fields:
    - protocolVersion
    - requirementHash
    - paidRequirement
    - settlement
    canonicalization: sha256 over compact key-sorted JSON, stated inline on every result
