spec_gaps:
- finding: four live GET routes are absent from the published OpenAPI
  detail: >-
    GET /v1/screen, GET /v1/price/token, GET /v1/resolve/name and GET /v1/intel/wallet each return a live
    402 PaymentRequired challenge and are advertised in llms.txt, the agent card and /.well-known/x402.json,
    but openapi.json documents only the POST wrapper for all four. An agent generating a client from the
    OpenAPI alone would never discover the GET form the provider's own documentation recommends.
  evidence:
  - url: https://api.anchor-x402.com/v1/screen?wallet=0x0000000000000000000000000000000000000000
    status: 402
  - url: https://api.anchor-x402.com/v1/price/token?symbol=ETH
    status: 402
  - url: https://api.anchor-x402.com/v1/resolve/name?name=vitalik.eth
    status: 402
  - url: https://api.anchor-x402.com/v1/intel/wallet?wallet=0x0000000000000000000000000000000000000000
    status: 402
- finding: the OpenAPI declares no securitySchemes
  detail: >-
    Every paid operation is gated by an x402 PAYMENT-SIGNATURE header, and the agent card models it
    correctly as an apiKey-in-header scheme, but components.securitySchemes is absent from openapi.json and
    no operation carries a security requirement. The contract therefore reads as fully anonymous.
- finding: the OpenAPI carries no tags and no examples
  detail: >-
    All 24 operations are untagged and there is not a single example anywhere in the document, while the
    agent card carries two worked examples per skill and x402.json carries a full input and output example
    per route. The richest example material the provider publishes is outside the spec.
- finding: version drift across the provider's own manifests
  detail: >-
    openapi.json info.version is 0.3.0, the MCP server card version is 0.3.0, and the agent card version is
    0.4.0. Nothing reconciles them.
