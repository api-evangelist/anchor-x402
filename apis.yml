apis:
- name: anchor-x402 API
  description: >-
    Eighteen stateless pay-per-call services on one FastAPI/AWS Lambda host. Every paid route answers an
    unpaid request with an x402 v2 402 PaymentRequired challenge carrying an accepts[] array of Base USDC,
    Solana USDC and Polygon JPYC rails; the caller signs an EIP-3009 authorization and retries the identical
    request with a PAYMENT-SIGNATURE header. /health, /openapi.json and /docs are free and unmetered.
  humanURL: https://api.anchor-x402.com/docs
  baseURL: https://api.anchor-x402.com
