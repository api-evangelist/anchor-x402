per_call_prices:
- path: /v1/anchor
  method: POST
  price_usd: 0.005
  category: security
  description: >-
    Anchor a 32-byte hash to Base + Solana mainnet in parallel. Returns both tx URLs as cryptographic proof of when the hash existed.
- path: /v1/screen
