jpyc_tier_mapping:
  note: >-
    Fixed yen amounts, not an FX conversion. The provider states they are pegged at an assumed ~JPY200/USD
    with no oracle, so the USD-equivalent floats in both directions, and that the $0.001 tier is snapped to
    JPY0.1 rather than JPY0.2 and therefore sits below the other tiers' implied rate. Both rails are honoured
    at face value and the caller picks from the accepts[] array.
  tiers:
    '0.001': 0.1
    '0.005': 1
    '0.01': 2
    '0.05': 10
    '1.77': 350
    '5.00': 1000
