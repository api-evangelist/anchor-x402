docs: https://anchor-x402.com/llms.txt
model: payment-as-authorization
accounts: false
api_keys: false
oauth: false
summary: >-
  There is no account, no registration, no API key and no bearer token anywhere in this API. Authorization
  IS payment. A request without a signed payment gets an HTTP 402 PaymentRequired carrying an accepts[]
  array of settlement options; the caller signs an EIP-3009 transferWithAuthorization for one of them and
  retries the identical request with the signed payload in a PAYMENT-SIGNATURE header. The x402 facilitator
  verifies and settles, and the service answers. Identity is a wallet, and it is presented per call rather
  than per session.
schemes:
- id: x402
  type: apiKey
  in: header
  name: PAYMENT-SIGNATURE
  legacy_name: X-PAYMENT
  legacy_note: The deprecated x402 V1 X-PAYMENT header spelling is still accepted alongside the V2 name.
  protocol: x402 v2
  applies_to: all 18 paid /v1/* routes and MCP tools/call
  description: >-
    x402 v2 pay-per-call. Modeled in the A2A agent card as an apiKey-in-header scheme because that is the
    closest A2A primitive; it is not a static credential - the header value is a signed, single-use,
    amount-bound payment authorization.
- id: a2a-ed25519-envelope
  type: signature
  applies_to: the four anchor-x402 extension methods on POST /v1/a2a (peer/hello, capabilities/list, peer/quote, peer/receipt)
  algorithm: ed25519
  digest: 'sha256:<hex> over compact key-sorted canonical JSON'
  signed_fields: [aud, body, exp, key_id, method, nonce, origin]
  audience: https://api.anchor-x402.com
  replay_protection:
    nonce: single-use, 8-128 chars
    exp_window_seconds: 300
  key_discovery: >-
    Peer identity bootstraps from DNS + TLS. A calling agent publishes an Ed25519 public key as a base64
    DER SubjectPublicKeyInfo in its own /.well-known/agent-card.json under any extensions.<namespace> block,
    either as a flat {key_id, public_key_der_base64} pair or a keys[] array for gapless rotation.
    anchor-x402 fetches that card and verifies against it. No human step and no registration.
  revocation: >-
    Delete the block or mark that key with a "status" of "retired"; either takes effect within 1h.
  server_keys:
    location: extensions["anchor-x402:a2a"].keys in the agent card
    custody: AWS KMS
    note: >-
      Two distinct key sets serve two jobs - signatures[] proves the card itself is authentic, while
      extensions["anchor-x402:a2a"].keys is what peers use to sign requests. The A2A spec has no field for
      the latter, which is why it lives in an extension.
  spec_methods_unsigned: >-
    The A2A spec methods themselves (message/send, tasks/get, tasks/cancel) are accepted unsigned, because a
    conformant A2A client will not produce this envelope; authorization there is the x402 payment.
