spec_gap: >-
  openapi.json declares no components.securitySchemes and carries no security requirement on any operation,
  so the published OpenAPI reads as an entirely open API. Everything in this file was reconstructed from the
  agent card, the MCP server card, llms.txt and a live 402 response. A securitySchemes block naming the
  PAYMENT-SIGNATURE header would make the contract self-describing.
