  format: x402 v2 PaymentRequired challenge
  retryable: true
  is_an_error: false
  meaning: >-
    Not a failure. This is the normal first half of every paid call - the server quoting a price. The body
    carries x402Version, a resource block (url, description, serviceName, tags, iconUrl) and an accepts[]
    array of settlement options, one per rail, each with scheme, network, asset, amount, payTo,
