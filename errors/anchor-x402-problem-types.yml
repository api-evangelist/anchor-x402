    worked output example for the route.
  remediation: >-
    Pick an entry from accepts[], sign an EIP-3009 transferWithAuthorization for it, and retry the identical
    request with the signed payload in a PAYMENT-SIGNATURE header (the deprecated V1 X-PAYMENT spelling is
    also accepted).
