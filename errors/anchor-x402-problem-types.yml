mcp_error_convention:
  surface: POST https://api.anchor-x402.com/mcp
  detail: >-
    A tools/call without payment does NOT return a JSON-RPC error. It returns a RESULT with isError true and
    the 402 challenge in structuredContent.accepts. The provider states the reason explicitly: a JSON-RPC
    error would be swallowed by the MCP client before the model ever saw it, whereas a result reaches the
    model, which can then pay. This is a deliberate inversion of the usual error convention and a caller
    that treats isError as terminal will never complete a paid call.
a2a_error_convention:
  surface: POST https://api.anchor-x402.com/v1/a2a
  detail: >-
    Ordinary JSON-RPC 2.0 error objects at HTTP 200. An unsigned extension-method call returns
    {"code": -32602, "message": "params.aud is required"} - observed live. A message/send naming a paid
    skill returns a Task in "auth-required" state carrying the payable URL, price and rails rather than an
    error.
