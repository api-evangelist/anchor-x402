cheapest_real_call_usd: 0.001
gap: >-
  A developer cannot exercise the paid path at all without funding a mainnet wallet. At $0.001 the barrier
  is financial only in the narrowest sense, but it is still a wallet, a bridge and a mainnet transaction
  before the first successful call - which is a meaningfully higher first-run cost than an API key, and the
  provider ships no testnet rail to remove it.
