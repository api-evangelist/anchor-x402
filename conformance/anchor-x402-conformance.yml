domain_standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  role: server
  evidence: >-
    The contract declares it about itself rather than in prose. A live unpaid POST to
    https://api.anchor-x402.com/v1/price/token returns HTTP 402 with a body whose first field is
    "x402Version": 2, followed by a resource block and an accepts[] array of three settlement options, plus
    a base64 payment-required response header carrying the same document. /.well-known/x402.json declares
    "x402_version": 2 and "discovery_extension": "bazaar" at the top level. 20 of 24 OpenAPI operations
    declare a 402 response.
  evidence_urls:
  - url: https://api.anchor-x402.com/v1/price/token
    status: 402
  - url: https://anchor-x402.com/.well-known/x402.json
    status: 200
  detail: >-
    This is the domain standard for this provider's market - machine-payable HTTP for AI agents - and the
    provider implements the server half of it across its entire surface rather than on a demo route. It
    additionally implements the x402 V1 X-PAYMENT header for backward compatibility.
- id: x402-bazaar
  name: CDP Bazaar discovery extension for x402
  conforms: true
  evidence: >-
    Every 402 challenge carries extensions.bazaar with an info block (input type/method/bodyType/body and an
    output example) and a 2020-12 JSON Schema, plus discoverable true and a category. The service is
    auto-indexed in CDP Bazaar as a result.
  evidence_url: https://docs.cdp.coinbase.com/x402/bazaar
- id: eip-3009
  name: EIP-3009 transferWithAuthorization
  conforms: true
  evidence: >-
    The documented settlement primitive on both EVM rails - the caller signs a transferWithAuthorization and
    the facilitator submits it, so the payer needs no prior approval transaction. Stated in llms.txt and
    implied by the accepts[].extra {name, version} EIP-712 domain fields in the live challenge.
- id: eip-191
  name: EIP-191 signed data
  conforms: true
  evidence: >-
