summary: >-
  This API has no entity model in the usual sense. It is deliberately stateless - the trust portal calls the
  statelessness a compensating control and says no per-customer PII is stored - so there are no resources to
  create, list, update or delete, no ids to hold between calls, and no relationships that outlive a request.
  What the $ref graph describes is nine request/response pairs plus nine shared value objects. The only
  identifiers that survive a single call are a job_id for the two async services and an on-chain transaction
  hash, and neither is a resource an agent can enumerate.
